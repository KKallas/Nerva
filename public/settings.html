<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Nerva</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<style>
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; }
  .card h2 { font-size:13px; color:var(--muted); margin:0 0 10px; text-transform:uppercase; letter-spacing:.05em; }
  .scan { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .scan img { width:180px; height:180px; max-width:100%; background:#fff; padding:10px; border-radius:10px; flex:none; }
  .scan .side { flex:1 1 190px; min-width:0; }   /* min-width:0 so it can shrink instead of overflowing */
  .addr { font-family:ui-monospace,Menlo,monospace; font-size:15px; overflow-wrap:anywhere; margin:0 0 10px; }
  .note { font-size:13px; color:var(--muted); margin:10px 0 0; }
  .note.warn { color:var(--warn); }
  .field { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
  .field label { flex:1 0 160px; font-size:15px; }
  .field label small { display:block; color:var(--muted); font-size:12px; }
  .field input { flex:0 1 220px; min-width:0; }
  .field input[type=number] { flex:0 0 100px; }
  dl { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:4px 14px; margin:0; font-size:14px; }
  dt { color:var(--muted); }
  dd { margin:0; font-variant-numeric:tabular-nums; word-break:break-all; }
  .ok { color:var(--ok); font-size:14px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .chips button { font:inherit; font-size:13px; padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--muted); cursor:pointer; }
  .chips button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
</style>
</head>
<body>
<script src="/parse.js"></script>
<script src="/app.js"></script>
<h1 id="title">Settings</h1>

<div class="card">
  <h2>Open on your phone</h2>
  <div class="scan">
    <img id="qr" alt="QR code for this address">
    <div class="side">
      <div class="chips" id="which"></div>
      <p class="addr" id="addr">…</p>
      <div class="btnrow" style="margin-top:0">
        <button class="btn" id="copy">Copy address</button>
        <a class="btn" id="open" target="_blank" rel="noreferrer">Open</a>
      </div>
      <p class="note" id="addrnote"></p>
    </div>
  </div>
</div>

<div class="card">
  <h2>Lab</h2>
  <div class="field">
    <label for="labName">Lab name<small>shown in the browser tab and on printouts</small></label>
    <input type="text" id="labName">
  </div>
  <div class="field">
    <label for="lowStock">Low stock at or below<small>drives the “low stock” filter on Items</small></label>
    <input type="number" id="lowStock" min="0" max="999">
  </div>
  <div class="field">
    <label for="loanDays">Loan period in days<small>used when borrowing starts working</small></label>
    <input type="number" id="loanDays" min="1" max="365">
  </div>
  <div class="btnrow">
    <button class="btn primary" id="save">Save</button>
    <span class="ok" id="saved" hidden>saved</span>
  </div>
</div>

<div class="card">
  <h2>This instance</h2>
  <dl id="status"></dl>
  <div class="btnrow"><a class="btn" href="/labels">Print labels for everything</a></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = Nerva.esc;
Nerva.nav('/settings');

let data = null;
let addresses = [];
let chosen = 0;
load();

async function load() {
  data = await (await fetch('/api/settings')).json();
  document.title = `Settings · ${data.config.labName}`;
  $('#title').textContent = `${data.config.labName} · settings`;

  // Every way this instance can be reached, best first. A phone scans one of them.
  addresses = [];
  const add = (url, label, note) => { if (url && !addresses.some(a => a.url === url)) addresses.push({ url, label, note }); };
  add(data.runtime && data.runtime.publicUrl, 'Public link',
    'Temporary Cloudflare tunnel. Works anywhere, over HTTPS. Anyone who has it can look things up (changes need a login), and it changes every time you restart the tunnel, so hold off printing labels from it.');
  add(data.baseUrlEnv, 'Configured', 'Set by BASE_URL in .env. Printed QR labels point here.');
  add(data.lanUrl, 'Wi-Fi', 'Reachable from any phone on the same network as this machine. Nothing leaves the building. Plain HTTP, so the phone camera cannot be used from inside the page later.');
  add(location.origin, 'This browser', location.hostname === 'localhost'
    ? 'Only this machine. Run "npm run phone" for an address your phone can open.' : 'The address you are using right now.');
  chosen = 0;
  showAddress();

  for (const k of ['labName', 'lowStock', 'loanDays']) $('#' + k).value = data.config[k];

  const s = data.status;
  $('#status').innerHTML = !s ? '<p class="muted">Log in to see the status.</p>' : rows([
    ['Items', `${s.items} (${s.sets} sets)`],
    ['Photos', `${s.photos} files, ${(s.photoBytes / 1048576).toFixed(1)} MB`],
    ['Open loans', s.openLoans],
    ['Data folder', s.dataDir],
    ['Running', `${Math.floor(s.uptimeSeconds / 60)} min on Node ${s.node}`],
  ]);
}

function showAddress() {
  const a = addresses[chosen];
  $('#which').innerHTML = addresses.map((x, n) =>
    `<button data-n="${n}" aria-pressed="${n === chosen}">${esc(x.label)}</button>`).join('');
  $('#addr').textContent = a.url;
  $('#open').href = a.url;
  $('#qr').src = '/api/qr.svg?text=' + encodeURIComponent(a.url);
  $('#addrnote').className = 'note' + (a.url.includes('trycloudflare.com') ? ' warn' : '');
  $('#addrnote').textContent = a.note;
}
$('#which').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  chosen = Number(b.dataset.n); showAddress();
});
const rows = pairs => pairs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');

$('#copy').onclick = async function () {
  try { await navigator.clipboard.writeText($('#addr').textContent); this.textContent = 'Copied'; }
  catch { this.textContent = 'Copy failed'; }
  setTimeout(() => { this.textContent = 'Copy address'; }, 1200);
};

$('#save').onclick = async function () {
  this.disabled = true;
  const body = { labName: $('#labName').value, lowStock: $('#lowStock').value, loanDays: $('#loanDays').value };
  try { await Nerva.api('PUT', '/api/settings', body); }
  catch (e) { this.disabled = false; $('#addrnote').textContent = e.message; return; }
  this.disabled = false;
  await Nerva.refreshCatalogue();
  await load();
  $('#saved').hidden = false;
  setTimeout(() => { $('#saved').hidden = true; }, 1500);
};
</script>
</body>
</html>
