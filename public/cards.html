<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login cards · Nerva</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<style>
  .sheet { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:10px; margin-top:12px; }
  /* a bank card: 85.6 x 54 mm, so it fits a wallet or a badge holder */
  .lcard { aspect-ratio:85.6/54; border:1px dashed var(--line); border-radius:10px; padding:4mm; display:flex; gap:4mm; align-items:center; background:#fff; color:#111; break-inside:avoid; }
  .lcard img { height:100%; aspect-ratio:1; flex:none; }
  .lcard .t { min-width:0; display:flex; flex-direction:column; gap:1.5mm; }
  .lcard .lab { font-size:11px; color:#555; text-transform:uppercase; letter-spacing:.05em; }
  .lcard .n { font-weight:700; font-size:16px; line-height:1.2; }
  .lcard .how { font-size:10px; color:#555; line-height:1.3; }
  .lcard .link { font-family:ui-monospace,Menlo,monospace; font-size:8.5px; color:#333; line-height:1.25; overflow-wrap:anywhere; }
  @media print {
    @page { size:A4; margin:10mm; }
    nav.tabs, .noprint { display:none !important; }
    body { background:#fff; max-width:none; padding:0; }
    .sheet { grid-template-columns:repeat(2, 85.6mm); gap:6mm; }
    .lcard { width:85.6mm; border:1px solid #bbb; }
  }
</style>
</head>
<body>
<script src="/parse.js"></script>
<script src="/app.js"></script>
<div class="noprint">
  <h1 style="font-size:18px">Login cards</h1>
  <p class="muted" id="what">…</p>
  <div class="btnrow">
    <button class="btn primary" onclick="print()">Print</button>
    <a class="btn" href="/users">Back to users</a>
  </div>
  <p class="muted">Anyone holding a card still needs the password. Lost one? <b>New card</b> on the Users page makes the old one stop working. The link printed under the QR does the same as scanning it, for anyone without a camera; <b>Copy login link</b> on the Users page puts it on the clipboard.</p>
</div>
<div class="sheet" id="sheet"></div>
<script>
const esc = Nerva.esc;
Nerva.nav('');
const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);

Nerva.api('GET', '/api/users').then(all => {
  const users = ids.length ? all.filter(u => ids.includes(u.id)) : [];
  const lab = Nerva.config.labName;
  document.getElementById('what').textContent = `${users.length} card${users.length === 1 ? '' : 's'}. Scanning one with a phone camera opens the login for that person.`;
  document.getElementById('sheet').innerHTML = users.map(u => `
    <div class="lcard">
      <img src="/api/users/${u.id}/card.svg" alt="login QR for ${esc(u.name)}">
      <div class="t">
        <div class="lab">${esc(lab)}</div>
        <div class="n">${esc(u.name)}</div>
        <div class="how">Scan with your phone camera, or open the link below. Then type your password.${u.hasPassword ? '' : ' The first time asks you to choose one.'}</div>
        <div class="link">${esc(u.loginUrl)}</div>
      </div>
    </div>`).join('') || '<p class="muted">Nothing to print.</p>';
}).catch(e => { document.getElementById('what').textContent = e.message; });

</script>
</body>
</html>
