<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loans · Nerva</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#1f2937">
<link rel="stylesheet" href="/app.css">
<style>
  h1 { font-size:22px; margin:8px 0 2px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin-top:10px; }
  .chips button { flex:none; font:inherit; font-size:14px; padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--muted); cursor:pointer; white-space:nowrap; }
  .chips button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .co { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; }
  .co.overdue { border-left-color:var(--bad); }
  .co.done { opacity:.6; }
  .co .top { display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; }
  .co .top b { font-size:16px; }
  .co .due { font-variant-numeric:tabular-nums; }
  .co.overdue .due { color:var(--bad); font-weight:600; }
  .co .ln { display:flex; gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); margin-top:6px; }
  .co .ln a { flex:1; min-width:0; color:inherit; text-decoration:none; }
  .co .ln.back a { color:var(--muted); text-decoration:line-through; }
  .co .btn { font-size:14px; padding:7px 11px; }
  .co input[type=date] { font:inherit; font-size:15px; padding:6px 9px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  #say { margin-top:10px; font-size:14px; white-space:pre-wrap; }
  #say.err { color:var(--bad); }
</style>
</head>
<body>
<h1 id="title">Checkouts</h1>
<p class="muted" id="sub"></p>
<div class="btnrow" id="links"></div>
<div class="chips" id="chips"></div>
<p id="say" class="muted" hidden></p>
<div id="list"><p class="muted">loading…</p></div>

<script src="/parse.js"></script>
<script src="/app.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = Nerva.esc;
Nerva.nav('/loans');

// An admin sees every checkout and checks things in. Everyone else sees their own.
const isAdmin = () => !!(Nerva.me && Nerva.me.role === 'admin');
const SORTS = { due: 'by return date', who: 'by person', newest: 'newest first' };
let sort = 'due', returned = false, loans = [];

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sort) { sort = b.dataset.sort; render(); } else { returned = !returned; load(); }
});
window.addEventListener('nerva:me', load);
load();

async function load() {
  if (!Nerva.me) { $('#list').innerHTML = '<p class="muted"><a href="/login?next=/loans">Log in</a> to see what you have checked out.</p>'; $('#chips').innerHTML = ''; return; }
  try { loans = await Nerva.api('GET', `/api/loans?${returned ? '' : 'open=1&'}${isAdmin() ? '' : 'mine=1'}`); render(); }
  catch (e) { say(e.message, true); }
}
function say(text, bad) { const el = $('#say'); el.textContent = text; el.hidden = !text; el.className = bad ? 'err' : 'muted'; }

// One card per checkout: the list someone saved, with its return date.
function render() {
  $('#title').textContent = isAdmin() ? 'All checkouts' : 'My checkouts';
  const open = loans.filter(l => !l.returnedAt);
  const late = open.filter(l => l.overdue).length;
  $('#sub').innerHTML = `${open.length} thing${open.length === 1 ? '' : 's'} out` + (late ? ` · <b class="warn">${late} overdue</b>` : '');
  $('#links').innerHTML = (isAdmin() ? '<a class="btn" href="/overview">Overview: who is late, what is missing</a>' : '')
    + `<a class="btn" href="/u/${esc(Nerva.me.username)}">My history</a>`;
  $('#chips').innerHTML = Object.entries(SORTS).map(([k, label]) => `<button data-sort="${k}" aria-pressed="${k === sort}">${label}</button>`).join('')
    + `<button data-returned aria-pressed="${returned}">show returned</button>`;

  const groups = new Map();
  for (const l of loans) { const k = l.checkout || l.id; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
  const cards = [...groups.entries()].map(([id, lines]) => {
    const live = lines.filter(l => !l.returnedAt);
    return { id, lines, live, who: lines[0].who, whoName: lines[0].whoName, taken: lines[0].borrowedAt,
      due: (live[0] || lines[0]).dueAt, overdue: live.some(l => l.overdue) };
  });
  const open1st = (a, b) => !a.live.length - !b.live.length;
  cards.sort((a, b) => open1st(a, b) || (sort === 'who' ? a.whoName.localeCompare(b.whoName) || a.due.localeCompare(b.due)
    : sort === 'newest' ? b.taken.localeCompare(a.taken) : a.due.localeCompare(b.due)));

  $('#list').innerHTML = cards.map(card).join('') || `<p class="muted">Nothing is out${isAdmin() ? '' : ' under your name'}. Build a list on <a href="/">Checkout</a> and press <b>out</b>.</p>`;
}

function card(c) {
  const mayMove = c.live.length && (isAdmin() || c.who === Nerva.me.username);
  return `<div class="co${c.overdue ? ' overdue' : ''}${c.live.length ? '' : ' done'}" data-co="${esc(c.id)}">
    <div class="top"><b>${isAdmin() ? `<a href="/u/${esc(c.who)}" style="color:inherit;text-decoration:none">${esc(c.whoName)}</a>` : esc(c.whoName)}</b>
      <span class="due">${c.live.length ? (c.overdue ? 'overdue since ' : 'back by ') + esc(c.due) : 'all returned'}</span></div>
    <div class="muted">${esc(c.id)} · taken ${esc(c.taken.slice(0, 10))}</div>
    ${c.lines.map(l => `<div class="ln${l.returnedAt ? ' back' : ''}">
      <a href="/i/${esc(l.itemId)}">${esc(l.name)}${l.qty > 1 ? ` x${l.returnedAt ? l.qty : l.outstanding}` : ''}${!l.returnedAt && l.returned ? ` <span class="muted">(${l.returned} already back)</span>` : ''}</a>
      ${l.returnedAt ? `<span class="muted">back ${esc(l.returnedAt.slice(0, 10))}</span>`
        : isAdmin() ? `<button class="btn" data-in="${esc(l.id)}">check in</button>` : ''}</div>`).join('')}
    ${mayMove ? `<div class="btnrow" style="align-items:center">
      ${isAdmin() && c.live.length > 1 ? '<button class="btn primary" data-inall>check in all</button>' : ''}
      <label class="muted">return date <input type="date" data-due min="${Nerva.day(0)}" value="${esc(c.due)}"></label></div>` : ''}
  </div>`;
}

// Checking in is filing a list with `in`, the same as from Checkout: one line
// for one thing, every open line for the whole checkout.
$('#list').addEventListener('click', async e => {
  const co = e.target.closest('[data-co]'); if (!co) return;
  const one = e.target.closest('[data-in]');
  if (!one && !e.target.closest('[data-inall]')) return;
  let lines = loans.filter(l => (l.checkout || l.id) === co.dataset.co && !l.returnedAt).map(l => ({ ...l, n: l.outstanding }));
  if (one) {
    lines = lines.filter(l => l.id === one.dataset.in);
    if (lines[0].n > 1) {
      const n = Math.round(Number(prompt(`How many of the ${lines[0].n} came back?`, lines[0].n)));
      if (!(n >= 1)) return;
      lines[0].n = Math.min(n, lines[0].n);
    }
  }
  try {
    const d = await Nerva.file('in', lines.map(l => NervaParse.formatLine(l.itemId, l.name, l.n)).join('\n'), { checkout: lines[0].checkout });
    say(d.lines.map(l => l.message).join('\n'), d.lines.some(l => !l.ok));
    await Nerva.refreshCatalogue();
    await load();
  } catch (err) { say(err.message, true); }
});

$('#list').addEventListener('change', async e => {
  const input = e.target.closest('[data-due]'); if (!input || !input.value) return;
  try { const d = await Nerva.api('PUT', `/api/checkouts/${input.closest('[data-co]').dataset.co}/due`, { due: input.value }); say(`Return date moved to ${d.due}.`); await Nerva.refreshCatalogue(); await load(); }
  catch (err) { say(err.message, true); await load(); }
});
</script>
</body>
</html>
