<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labels · Nerva</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<style>
  .sheet { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:8px; margin-top:12px; }
  .label { border:1px dashed var(--line); border-radius:8px; padding:8px; display:flex; gap:8px; align-items:center; background:var(--card); break-inside:avoid; }
  .label img { width:64px; height:64px; flex:none; background:#fff; padding:3px; border-radius:4px; }
  .label .t { min-width:0; }
  .label .n { font-weight:600; font-size:13px; line-height:1.25; }
  .label .i { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); }
  .label .w { font-size:11px; color:var(--muted); }
  @media print {
    @page { size:A4; margin:10mm; }
    nav.tabs, .noprint { display:none !important; }
    body { background:#fff; color:#000; max-width:none; padding:0; }
    .sheet { grid-template-columns:repeat(3, 1fr); gap:4mm; }
    .label { border:1px solid #bbb; background:#fff; }
    .label .i, .label .w { color:#555; }
  }
</style>
</head>
<body>
<div class="noprint">
  <h1 style="font-size:18px">Labels</h1>
  <p class="muted" id="what"></p>
  <div class="btnrow">
    <button class="btn primary" onclick="print()">Print</button>
    <a class="btn" href="/items">Back to items</a>
  </div>
  <p class="muted" style="margin-top:8px">Printing one at a time on a pocket sticker printer? Open an item or a shelf and choose <b>Sticker printer</b>.</p>
</div>
<div class="sheet" id="sheet"></div>
<script src="/parse.js"></script>
<script src="/app.js"></script>
<script>
Nerva.nav('/items');
const esc = Nerva.esc;
const params = new URLSearchParams(location.search);
const ids = (params.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
const places = (params.get('places') || '').split(',').map(s => s.trim()).filter(Boolean);
if (places.length) renderPlaces(); else Nerva.loadCatalogue((all, how) => {
  if (how === 'cached') return;
  // A product that is numbered individually turns into one label per unit,
  // because each physical one carries its own QR. An explicit unit id
  // ("338va6-2") prints just that one.
  const labels = [];
  const push = (i, n) => labels.push({
    id: n ? `${i.id}-${n}` : i.id,
    name: i.name + (n ? ` #${n}` : ''),
    location: i.location,
  });
  const expand = i => (i.tracked && i.units && i.units.length ? i.units.forEach(n => push(i, n)) : push(i));
  if (!ids.length) all.forEach(expand);
  for (const id of ids) {
    const m = /^(.+)-(\d+)$/.exec(id);
    const item = all.find(i => i.id === (m ? m[1] : id));
    if (!item) continue;
    if (m) push(item, Number(m[2])); else expand(item);
  }
  const items = labels;
  document.getElementById('what').textContent = `${items.length} label${items.length === 1 ? '' : 's'}. Each QR opens that item's page. Numbered items get one label each.`;
  document.getElementById('sheet').innerHTML = items.map(i => `
    <div class="label">
      <img src="/api/items/${i.id}/qr.svg" alt="QR for ${esc(i.name)}">
      <div class="t">
        <div class="n">${esc(i.name)}</div>
        <div class="i">${i.id}</div>
        <div class="w">${esc(i.location) || ''}</div>
      </div>
    </div>`).join('') || '<p class="muted">Nothing to print.</p>';
});

// Shelf and location labels. "all" prints one for every shelf in the lab.
async function renderPlaces() {
  const locations = await (await fetch('/api/locations')).json();
  const out = [];
  const wanted = places.includes('all') ? null : new Set(places);
  for (const l of locations) {
    if (!wanted || wanted.has(l.id)) out.push({ id: l.id, name: l.name, location: 'location' });
    for (const s of l.shelves) if (!wanted || wanted.has(s.id)) out.push({ id: s.id, name: `${l.name}, ${s.name}`, location: 'shelf' });
  }
  document.getElementById('what').textContent = `${out.length} place label${out.length === 1 ? '' : 's'}. Each QR opens that place and lists what belongs there.`;
  document.getElementById('sheet').innerHTML = out.map(p => `
    <div class="label">
      <img src="/api/places/${p.id}/qr.svg" alt="QR for ${esc(p.name)}">
      <div class="t"><div class="n">${esc(p.name)}</div><div class="i">${p.id}</div><div class="w">${p.location}</div></div>
    </div>`).join('') || '<p class="muted">Nothing to print.</p>';
}
</script>
</body>
</html>
