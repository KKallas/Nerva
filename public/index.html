<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout · Nerva</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#1f2937">
<link rel="stylesheet" href="/app.css">
<style>
  section.list { margin-top:22px; }
  section.list h2 { font-size:15px; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  textarea { width:100%; min-height:140px; font:15px/1.5 ui-monospace,Menlo,monospace; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); resize:vertical; }
  .verbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .verbs button { flex:1; min-width:64px; font-size:16px; padding:12px 8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .verbs button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .verbs button:disabled { opacity:.4; cursor:not-allowed; }
  .out { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .out .r { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:8px; padding:8px 10px; font-size:14px; white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; }
  .out .r.bad { border-left-color:var(--bad); }
  .out .r.swapped { border-left-color:var(--accent); }
  .out .r b { display:block; font-family:system-ui,sans-serif; }
  .out .r a { color:var(--accent); text-decoration:none; }
  .opts { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .opt { display:flex; gap:10px; align-items:center; width:100%; text-align:left; font:inherit; font-family:system-ui,sans-serif; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .opt:active { background:var(--line); }
  .opt .id { font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:13px; flex:none; }
  .opt .nm { flex:1; min-width:0; }
  .opt .nm small { display:block; color:var(--muted); }
  /* what is already out, shown while the list is being built */
  .away { margin-top:6px; font-size:14px; color:var(--warn); }
  .away div { padding:1px 0; }
  .confirm { background:var(--card); border:1px solid var(--accent); border-radius:10px; padding:12px; }
  .confirm h3 { margin:0 0 8px; font-size:16px; }
  .confirm .cl { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-top:1px solid var(--line); font-size:15px; }
  .confirm .cl small { color:var(--muted); text-align:right; }
  .confirm .cl.no small { color:var(--warn); }
  .confirm label { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .confirm input[type=date], .confirm input[type=number] { font:inherit; font-size:16px; padding:9px 11px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  .confirm input[type=number] { width:5em; text-align:right; }
  .confirm .cl .was { color:var(--muted); font-size:13px; white-space:nowrap; }
</style>
</head>
<body>
<header class="sticky">
  <input type="search" id="q" placeholder="What do you need? e.g. m5 bolt" autocomplete="off" autofocus>
</header>
<div class="rows" id="results"><p class="muted">Search, tap <b>+</b> to put things on your list, then file the list with a verb below.</p></div>

<section class="list">
  <h2>List</h2>
  <textarea id="list" placeholder="one line per item: id, id x3, or a name&#10;scan or tap + to add lines"></textarea>
  <div class="away" id="away"></div>
  <div class="verbs">
    <button id="scan" title="scan labels with the camera">📷 scan</button>
    <button data-verb="find" class="primary">find</button>
    <button data-verb="out">out</button>
    <button data-verb="in" id="verbin" hidden title="check things back in (admin)">in</button>
    <button data-verb="count" title="the shelf actually has this many">count</button>
    <button id="clear">clear</button>
  </div>
  <div class="out" id="out"></div>
</section>

<script src="/parse.js"></script>
<script src="/search.js"></script>
<script src="/app.js"></script>
<script src="/scan.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = Nerva.esc;
Nerva.nav('/');

Nerva.loadCatalogue((items, how) => {
  Nerva.status(how === 'empty' ? 'offline, no catalogue yet' : `${items.length} items${how === 'cached' ? ' (cached)' : how === 'offline' ? ' (offline)' : ''}`);
  // the cached copy arrives before the list below exists, and both are drawn
  // once further down anyway; only a fresh catalogue needs drawing again
  if (how !== 'cached') { render(); showAway(); }
});

// Checking in is the admin's: nobody else is shown the button.
const showVerbs = () => { $('#verbin').hidden = !(Nerva.me && Nerva.me.role === 'admin'); };
showVerbs();
window.addEventListener('nerva:me', showVerbs);

// ---- search ----
$('#q').addEventListener('input', render);
function render() {
  const q = $('#q').value.trim();
  const box = $('#results');
  if (!q) { box.innerHTML = '<p class="muted">Search, tap <b>+</b> to put things on your list, then file the list with a verb below.</p>'; return; }
  const hits = NervaSearch.search(Nerva.catalogue, q, 50);
  box.innerHTML = hits.length ? hits.map(i => Nerva.itemRow(i)).join('')
    : `<p class="muted">Nothing matches "${esc(q)}". <a href="/items">Browse all items</a>.</p>`;
}
Nerva.wireAdd($('#results'));

// ---- the list ----
const ta = $('#list');
ta.value = Nerva.listText();
ta.addEventListener('input', () => Nerva.setList(ta.value));
window.addEventListener('nerva:list', () => { if (ta.value !== Nerva.listText()) ta.value = Nerva.listText(); showAway(); });
$('#clear').onclick = () => { ta.value = ''; Nerva.setList(''); $('#out').innerHTML = ''; };

// What the cached catalogue says about one line of the list: its name, how
// many, and whether it is out already and until when. Local, so it works at
// the shelf without a connection. `no` means the line will not go through.
function lineInfo(entry) {
  const m = /^([a-z0-9]{4,8})-(\d{1,4})$/.exec(entry.id || '');
  const item = entry.id && Nerva.catalogue.find(c => c.id === (m ? m[1] : entry.id));
  const unitN = item && m ? Number(m[2]) : null;
  if (!item || (unitN && !(item.units || []).includes(unitN))) return { name: entry.raw.trim(), say: 'looked up when you confirm' };
  const away = Nerva.outText(item, unitN);
  if (unitN) return { name: `${item.name} #${unitN}`, away, no: !!away, say: away || `until the date below` };
  if (item.tracked) return { name: item.name, away, say: 'numbered: you will be asked which one' + (away ? ` · ${away}` : '') };
  if (item.consumable) return { name: `${item.name} x${entry.qty}`, used: true, say: 'used up, not expected back' };
  return { name: `${item.name} x${entry.qty}`, away, say: `${item.quantity} on the shelf` + (away ? ` · ${away}` : '') };
}
// Under the list, as it is built: whatever on it is already out, and until when.
function showAway() {
  $('#away').innerHTML = NervaParse.parseList(ta.value).map(lineInfo).filter(i => i.away)
    .map(i => `<div>${esc(i.name)} · ${esc(i.away)}</div>`).join('');
}
showAway();

document.querySelectorAll('[data-verb]').forEach(btn => btn.onclick = () => {
  if (!NervaParse.parseList(ta.value).length) { $('#out').innerHTML = '<p class="muted">The list is empty.</p>'; return; }
  if (btn.dataset.verb === 'out') confirmOut(); else if (btn.dataset.verb === 'count') confirmCount(); else file(btn.dataset.verb);
});

// Scanning appends "[id] Name" per label, like tapping +. A numbered one's
// label carries its own id. Unknown ids are refused on the spot rather than
// filed as a name the server would not find.
if (!NervaScan.supported()) { $('#scan').disabled = true; $('#scan').title = 'no camera in this browser'; }
$('#scan').onclick = () => NervaScan.scan(id => {
  const m = /^([a-z0-9]{4,8})-(\d{1,4})$/.exec(id);
  const item = Nerva.catalogue.find(c => c.id === (m ? m[1] : id));
  if (!item || (m && !(item.units || []).includes(Number(m[2])))) return false;
  const name = m ? `${item.name} #${m[2]}` : item.name;
  Nerva.addLine(id, name);
  return name;
});

// Counting asks once too: every counted product on the list with what the
// shelf said last time and a box for what it says now. A line with no
// quantity written starts at the old number, so confirming changes nothing
// you did not type. Numbered ones and unknown lines go through as written.
function confirmCount() {
  if (!Nerva.me) return Nerva.toLogin();
  const entries = NervaParse.parseList(ta.value);
  const rows = entries.map(e => {
    const item = e.id && !/-/.test(e.id) && Nerva.catalogue.find(c => c.id === e.id);
    if (!item || item.tracked) return { e, ...lineInfo(e), fixed: true, say: item ? 'numbered: not counted' : lineInfo(e).say };
    const typed = /\bx\d+\b/i.test(e.raw);
    return { e, item, name: item.name, was: item.quantity ?? 0, now: typed ? e.qty : (item.quantity ?? 0) };
  });
  $('#out').innerHTML = `<div class="confirm"><h3>Count: the shelf has this many</h3>
    ${rows.map((r, i) => r.fixed
      ? `<div class="cl${r.no ? ' no' : ''}"><span>${esc(r.name)}</span><small>${esc(r.say)}</small></div>`
      : `<div class="cl"><span>${esc(r.name)} <span class="was">was ${r.was}</span></span><input type="number" min="0" step="1" inputmode="numeric" data-i="${i}" value="${r.now}"></div>`).join('')}
    <div class="btnrow"><button class="btn primary" id="docount">Set counts</button><button class="btn" id="nocount">Not yet</button></div></div>`;
  const first = $('#out input'); if (first) first.select();
  $('#nocount').onclick = () => { $('#out').innerHTML = ''; };
  $('#docount').onclick = () => {
    // rewrite the list as "[id] Name xN" with the numbers typed, then file it
    const lines = ta.value.split('\n');
    $('#out').querySelectorAll('input[data-i]').forEach(inp => {
      const r = rows[Number(inp.dataset.i)];
      const n = Math.max(0, Math.round(Number(inp.value) || 0));
      lines[r.e.n - 1] = `${NervaParse.formatLine(r.item.id, r.item.name)} x${n}`;
    });
    ta.value = lines.join('\n');
    Nerva.setList(ta.value);
    file('count');
  };
}

// Taking things is saved under your name, so it asks once: this list, back by
// this date. The date starts at today plus the lab's loan period.
function confirmOut() {
  if (!Nerva.me) return Nerva.toLogin();   // the list is kept; it is waiting when you come back
  const lines = NervaParse.parseList(ta.value).map(lineInfo);
  const lent = lines.some(l => !l.used);
  $('#out').innerHTML = `<div class="confirm"><h3>Check out as ${esc(Nerva.me.name)}</h3>
    ${lines.map(l => `<div class="cl${l.no ? ' no' : ''}"><span>${esc(l.name)}</span><small>${esc(l.say)}</small></div>`).join('')}
    ${lent ? `<label>Bring back by <input type="date" id="due" min="${Nerva.day(0)}" value="${Nerva.day(Nerva.config.loanDays || 14)}"></label>` : ''}
    <div class="btnrow"><button class="btn primary" id="doout">Confirm checkout</button><button class="btn" id="noout">Not yet</button></div></div>`;
  $('#noout').onclick = () => { $('#out').innerHTML = ''; };
  $('#doout').onclick = () => file('out', { due: lent ? $('#due').value : '' });
}

async function file(verb, opts) {
  const out = $('#out');
  const sent = ta.value;
  out.innerHTML = '<p class="muted">…</p>';
  try {
    const d = await Nerva.file(verb, sent, opts);
    out.innerHTML = d.lines.map(renderResult).join('') || '<p class="muted">Nothing to do.</p>';
    if (verb === 'find') return;
    // Filed lines leave the list; the ones that failed stay for another try.
    const failed = new Set(d.lines.filter(l => !l.ok).map(l => l.n));
    if (ta.value === sent) {
      ta.value = sent.split('\n').filter((_, i) => failed.has(i + 1)).join('\n');
      Nerva.setList(ta.value);
    }
    if (verb === 'out' && d.lines.some(l => l.checkout)) out.insertAdjacentHTML('beforeend', '<p class="muted">Saved. <a href="/loans">Your checkouts</a></p>');
    await Nerva.refreshCatalogue();
    render(); showAway();
  } catch (e) {
    out.innerHTML = `<div class="r bad">${e instanceof TypeError ? 'Could not reach the server (offline?). The list is kept.' : esc(e.message)}</div>`;
  }
}
// The line as the user wrote it, with its id turned into a link rather than
// repeated in front of it.
function header(l) {
  const line = esc(l.line.trim());
  if (!l.item) return `<b>${line}</b>`;
  const id = l.item.id;
  const link = `<a href="/i/${id}">`;
  return `<b>${line.includes('[' + id + ']')
    ? line.replace('[' + id + ']', `${link}[${id}]</a>`)
    : `${link}${id}</a> ${line}`}</b>`;
}

function renderResult(l) {
  const head = header(l);
  if (l.item) return `<div class="r">${head}${esc(l.message)}</div>`;
  if (!l.matches) return `<div class="r bad">${head}${esc(l.message)}</div>`;
  // text matched one or more items: offer to swap the line for the exact id
  return `<div class="r" data-n="${l.n}" data-line="${esc(l.line)}">${head}${esc(l.message)}<div class="opts">${l.matches.map(m => `
    <button class="opt" data-id="${m.id}" data-name="${esc(m.name)}" data-desc="${esc(m.quantity + ' · ' + (m.location || 'no location'))}">
      <span class="id">${m.id}</span><span class="nm">${esc(m.name)}${m.kind === 'set' ? ' <small>set</small>' : ''}<small>${m.quantity} · ${esc(m.location) || 'no location'}</small></span></button>`).join('')}</div></div>`;
}
$('#out').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const r = b.closest('.r');
  swapLine(Number(r.dataset.n), r.dataset.line, b.dataset.id, b.dataset.name);
  r.outerHTML = `<div class="r swapped"><b><a href="/i/${b.dataset.id}">[${b.dataset.id}]</a> ${esc(b.dataset.name)}</b>${esc(b.dataset.desc)}</div>`;
});
// Replace the line that produced a result with "[id] Name", keeping any "xN"
// quantity the user typed. Falls back to searching for the line if the list
// was edited while the results were on screen.
function swapLine(n, original, id, name) {
  const lines = ta.value.split('\n');
  let i = n - 1;
  if (lines[i] !== original) i = lines.findIndex(x => x.trim() === original.trim());
  const parsed = NervaParse.parseLine(original, n) || {};
  const replacement = NervaParse.formatLine(id, name, parsed.qty);
  if (i < 0) lines.push(replacement); else lines[i] = replacement;
  ta.value = lines.join('\n');
  Nerva.setList(ta.value);
}
</script>
</body>
</html>
