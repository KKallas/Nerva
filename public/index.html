<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout · Nerva</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="theme-color" content="#1f2937">
<link rel="stylesheet" href="/app.css">
<style>
  section.list { margin-top:22px; }
  section.list h2 { font-size:15px; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  textarea { width:100%; min-height:140px; font:15px/1.5 ui-monospace,Menlo,monospace; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); resize:vertical; }
  .verbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .verbs button { flex:1; min-width:64px; font-size:16px; padding:12px 8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .verbs button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .verbs button:disabled { opacity:.4; cursor:not-allowed; }
  .out { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .out .r { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ok); border-radius:8px; padding:8px 10px; font-size:14px; white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; }
  .out .r.bad { border-left-color:var(--bad); }
  .out .r.swapped { border-left-color:var(--accent); }
  .out .r b { display:block; font-family:system-ui,sans-serif; }
  .out .r a { color:var(--accent); text-decoration:none; }
  .opts { display:flex; flex-direction:column; gap:6px; margin-top:6px; }
  .opt { display:flex; gap:10px; align-items:center; width:100%; text-align:left; font:inherit; font-family:system-ui,sans-serif; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); cursor:pointer; }
  .opt:active { background:var(--line); }
  .opt .id { font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:13px; flex:none; }
  .opt .nm { flex:1; min-width:0; }
  .opt .nm small { display:block; color:var(--muted); }
</style>
</head>
<body>
<header class="sticky">
  <input type="search" id="q" placeholder="What do you need? e.g. m5 bolt" autocomplete="off" autofocus>
</header>
<div class="rows" id="results"><p class="muted">Search, tap <b>+</b> to put things on your list, then file the list with a verb below.</p></div>

<section class="list">
  <h2>List</h2>
  <textarea id="list" placeholder="one line per item: id, id x3, or a name&#10;scan or tap + to add lines"></textarea>
  <div class="verbs">
    <button id="scan" disabled title="camera scanning arrives in step 2">📷 scan</button>
    <button data-verb="find" class="primary">find</button>
    <button data-verb="out" disabled title="step 3">out</button>
    <button data-verb="in" disabled title="step 3">in</button>
    <button data-verb="count" disabled title="step 3">count</button>
    <button id="clear">clear</button>
  </div>
  <div class="out" id="out"></div>
</section>

<script src="/parse.js"></script>
<script src="/search.js"></script>
<script src="/app.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = Nerva.esc;
Nerva.nav('/');

Nerva.loadCatalogue((items, how) => {
  Nerva.status(how === 'empty' ? 'offline, no catalogue yet' : `${items.length} items${how === 'cached' ? ' (cached)' : how === 'offline' ? ' (offline)' : ''}`);
  if (how !== 'cached') render();
});

// ---- search ----
$('#q').addEventListener('input', render);
function render() {
  const q = $('#q').value.trim();
  const box = $('#results');
  if (!q) { box.innerHTML = '<p class="muted">Search, tap <b>+</b> to put things on your list, then file the list with a verb below.</p>'; return; }
  const hits = NervaSearch.search(Nerva.catalogue, q, 50);
  box.innerHTML = hits.length ? hits.map(i => Nerva.itemRow(i)).join('')
    : `<p class="muted">Nothing matches "${esc(q)}". <a href="/items">Browse all items</a>.</p>`;
}
Nerva.wireAdd($('#results'));

// ---- the list ----
const ta = $('#list');
ta.value = Nerva.listText();
ta.addEventListener('input', () => Nerva.setList(ta.value));
window.addEventListener('nerva:list', () => { if (ta.value !== Nerva.listText()) ta.value = Nerva.listText(); });
$('#clear').onclick = () => { ta.value = ''; Nerva.setList(''); $('#out').innerHTML = ''; };

document.querySelectorAll('[data-verb]').forEach(btn => btn.onclick = () => file(btn.dataset.verb));
async function file(verb) {
  const out = $('#out');
  if (!NervaParse.parseList(ta.value).length) { out.innerHTML = '<p class="muted">The list is empty.</p>'; return; }
  out.innerHTML = '<p class="muted">…</p>';
  try {
    const r = await fetch('/api/file?verb=' + verb, { method: 'POST', headers: { 'content-type': 'text/plain' }, body: ta.value });
    const d = await r.json();
    if (!r.ok) { out.innerHTML = `<div class="r bad">${esc(d.error)}</div>`; return; }
    out.innerHTML = d.lines.map(renderResult).join('') || '<p class="muted">Nothing to do.</p>';
  } catch (e) { out.innerHTML = '<div class="r bad">Could not reach the server (offline?). The list is kept.</div>'; }
}
function renderResult(l) {
  const head = `<b>${esc(l.line.trim())}</b>`;
  if (l.item) return `<div class="r"><b><a href="/i/${l.item.id}">${l.item.id}</a> ${esc(l.line.trim())}</b>${esc(l.message)}</div>`;
  if (!l.matches) return `<div class="r bad">${head}${esc(l.message)}</div>`;
  // text matched one or more items: offer to swap the line for the exact id
  return `<div class="r" data-n="${l.n}" data-line="${esc(l.line)}">${head}${esc(l.message)}<div class="opts">${l.matches.map(m => `
    <button class="opt" data-id="${m.id}" data-name="${esc(m.name)}" data-desc="${esc(m.quantity + ' · ' + (m.location || 'no location'))}">
      <span class="id">${m.id}</span><span class="nm">${esc(m.name)}${m.kind === 'set' ? ' <small>set</small>' : ''}<small>${m.quantity} · ${esc(m.location) || 'no location'}</small></span></button>`).join('')}</div></div>`;
}
$('#out').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if (!b) return;
  const r = b.closest('.r');
  swapLine(Number(r.dataset.n), r.dataset.line, b.dataset.id);
  r.outerHTML = `<div class="r swapped"><b><a href="/i/${b.dataset.id}">${b.dataset.id}</a> ${esc(b.dataset.name)}</b>${esc(b.dataset.desc)}</div>`;
});
// Replace the line that produced a result with the exact id. Keeps any "xN" quantity
// and note the user typed. Falls back to searching for the line if the list was edited.
function swapLine(n, original, id) {
  const lines = ta.value.split('\n');
  let i = n - 1;
  if (lines[i] !== original) i = lines.findIndex(x => x.trim() === original.trim());
  const parsed = NervaParse.parseLine(original, n) || {};
  const extra = [parsed.qty > 1 ? 'x' + parsed.qty : '', parsed.id ? parsed.note : ''].filter(Boolean).join(' ');
  const replacement = (id + ' ' + extra).trim();
  if (i < 0) lines.push(replacement); else lines[i] = replacement;
  ta.value = lines.join('\n');
  Nerva.setList(ta.value);
}
</script>
</body>
</html>
