<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nerva</title>
<link rel="icon" href="/icon.svg">
<style>
  :root { --bg:#f6f7f9; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --card:#fff; --accent:#2563eb; --warn:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --line:#374151; --card:#1f2937; --accent:#60a5fa; --warn:#fbbf24; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,sans-serif; padding:0 16px 40px; max-width:720px; margin-inline:auto; }
  nav { padding:12px 0; } nav a { color:var(--accent); text-decoration:none; }
  h1 { font-size:22px; margin:0 0 4px; }
  .id { font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:14px; }
  .big { font-size:18px; margin:12px 0; }
  .big b { font-size:26px; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  .photos figure { margin:0; }
  .photos img, .photos .none { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--line); display:block; }
  .photos .none { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }
  figcaption { color:var(--muted); font-size:13px; margin-top:4px; }
  .tags span { display:inline-block; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:2px 10px; font-size:13px; margin:2px 4px 2px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:12px 0; }
  .card h2 { font-size:14px; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .warn { color:var(--warn); }
  button.primary { width:100%; font-size:18px; padding:14px; border-radius:10px; border:0; background:var(--accent); color:#fff; cursor:pointer; margin-top:8px; }
  ul { padding-left:20px; margin:4px 0; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<nav><a href="/">← search</a></nav>
<div id="app"><p class="muted">loading…</p></div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id = location.pathname.split('/').pop().toLowerCase();
fetch('/api/items/' + id).then(async r => {
  const app = document.getElementById('app');
  if (!r.ok) { app.innerHTML = `<h1>Unknown id <span class="id">${esc(id)}</span></h1><p class="muted">No item with this id. It may have been deleted, or the QR is from another lab.</p>`; return; }
  const i = await r.json();
  document.title = i.name + ' · Nerva';
  app.innerHTML = `
    <h1>${esc(i.name)} ${i.kind === 'set' ? '<span class="muted">(set)</span>' : ''}</h1>
    <div class="id">${i.id}</div>
    ${i.description ? `<p>${esc(i.description)}</p>` : ''}
    <div class="big"><b>${i.quantity ?? 0}</b> in stock${i.location ? ` · <b>${esc(i.location)}</b>` : ' · <span class="warn">no location set</span>'}</div>
    <div class="photos">
      <figure>${i.photo ? `<img src="/photos/${i.id}-item.jpg" alt="">` : '<div class="none">no photo</div>'}<figcaption>the item</figcaption></figure>
      <figure>${i.locationPhoto ? `<img src="/photos/${i.id}-loc.jpg" alt="">` : '<div class="none">no photo</div>'}<figcaption>where it lives</figcaption></figure>
    </div>
    ${i.tags?.length ? `<div class="tags">${i.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
    ${i.kind === 'set' ? `<div class="card"><h2>Contents</h2><ul>${i.contents.map(c => `<li><a href="/i/${c.itemId}">${esc(c.name)}</a> × ${c.qty}</li>`).join('') || '<li class="muted">empty</li>'}</ul>
      ${i.missing?.length ? `<p class="warn">Missing: ${i.missing.map(m => `${esc(m.itemId)} × ${m.qty}`).join(', ')}</p>` : ''}</div>` : ''}
    ${i.openLoans?.length ? `<div class="card"><h2>Out with</h2><ul>${i.openLoans.map(l => `<li>${esc(l.who)} × ${l.qty} since ${l.borrowedAt.slice(0,10)}</li>`).join('')}</ul></div>` : ''}
    <button class="primary" id="add">+ add to my list</button>
    <p class="muted">Updated ${i.updatedAt ? i.updatedAt.slice(0,10) : '—'}</p>`;
  document.getElementById('add').onclick = () => {
    let list = ''; try { list = localStorage.getItem('nerva.list') || ''; } catch {}
    list = (list.trimEnd() ? list.trimEnd() + '\n' : '') + i.id + '\n';
    try { localStorage.setItem('nerva.list', list); } catch {}
    location.href = '/';
  };
});
</script>
</body>
</html>
