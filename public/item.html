<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nerva</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
<style>
  h1 { font-size:22px; margin:0 0 4px; }
  .id { font-family:ui-monospace,Menlo,monospace; color:var(--muted); font-size:14px; }
  .big { font-size:18px; margin:12px 0; }
  .big b { font-size:26px; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 0; }
  /* one wide picture when the individual photos live on the numbered ones */
  .photos.one { grid-template-columns:1fr; }
  .photos.one img, .photos.one .none { aspect-ratio:3/2; }
  .photos figure { margin:0; }
  .photos img, .photos .none { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; background:var(--line); display:block; border:0; }
  .photos .none { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; cursor:pointer; font:inherit; text-align:center; padding:8px; }
  .photos .none:hover { border:1px dashed var(--accent); color:var(--accent); }
  .photos .stand-in { position:relative; padding:0; overflow:hidden; }
  .photos .stand-in img { width:100%; height:100%; object-fit:cover; opacity:.35; }
  .photos .stand-in span { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; line-height:1.35; text-align:center; padding:8px; background:rgba(0,0,0,.06); }
  figcaption { color:var(--muted); font-size:13px; margin-top:4px; display:flex; gap:8px; align-items:baseline; }
  figcaption button { font:inherit; font-size:13px; background:none; border:0; padding:0; color:var(--accent); cursor:pointer; }
  figcaption button.rm { color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:12px 0; }
  .card h2 { font-size:14px; color:var(--muted); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .qrbox { display:flex; gap:12px; align-items:center; }
  .qrbox img { width:96px; height:96px; background:#fff; padding:4px; border-radius:6px; }
  .units { display:flex; flex-direction:column; gap:6px; }
  .unit { display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--bg); }
  .unit a.grab { flex:1; min-width:0; display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .unit img.qr { width:46px; height:46px; flex:none; background:#fff; padding:3px; border-radius:4px; }
  .unit .pic { width:46px; height:46px; flex:none; border-radius:6px; object-fit:cover; background:var(--line); display:block; }
  .unit .n { font-weight:700; font-variant-numeric:tabular-nums; }
  .unit .say { font-size:12px; color:var(--muted); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .unit a.pr { color:var(--muted); font-size:13px; text-decoration:none; }
  .unit button { font:inherit; font-size:13px; border:0; background:none; color:var(--muted); cursor:pointer; padding:2px 4px; }
  .unit button:hover { color:var(--bad); }
  /* the one you just scanned, so a QR in your hand matches a row on screen */
  .unit.here { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; background:var(--card); }
  .unit.here .n, .unit.here .say { color:var(--accent); }
  .unit.here .say { font-weight:600; }
  .countrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .countrow input { width:110px; font-size:17px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  .log { list-style:none; padding:0; margin:10px 0 0; font-size:13px; color:var(--muted); }
  .log li { padding:2px 0; }
  .log b { color:var(--fg); font-variant-numeric:tabular-nums; font-weight:600; }
  select { width:100%; font-size:16px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  .badge { font-size:15px; color:var(--muted); font-weight:normal; }
  details.edit { margin:10px 0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  details.edit summary { cursor:pointer; color:var(--accent); font-size:14px; }
  details.edit label { display:block; margin-top:10px; font-size:13px; color:var(--muted); }
  details.edit input { width:100%; font-size:16px; padding:9px 11px; margin-top:3px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  ul { padding-left:20px; margin:4px 0; }
  .muted { color:var(--muted); }
  .err { color:var(--bad); font-size:14px; margin-top:8px; }
</style>
</head>
<body>
<div id="app"><p class="muted">loading…</p></div>
<script src="/parse.js"></script>
<script src="/paint.js"></script>
<script src="/app.js"></script>
<script>
const esc = Nerva.esc;
Nerva.nav('/items');
const id = location.pathname.split('/').pop().toLowerCase();
let item = null;

load();
async function load() {
  const app = document.getElementById('app');
  const r = await fetch('/api/items/' + id);
  if (!r.ok) {
    app.innerHTML = `<h1>Unknown id <span class="id">${esc(id)}</span></h1><p class="muted">No item with this id. It may have been deleted, or the QR is from another lab.</p>`;
    return;
  }
  item = await r.json();
  document.title = item.name + ' · Nerva';
  app.innerHTML = view(item);
  wire();
}

// One photo slot. `target` is what the photo belongs to: a numbered one
// photographs itself, while the location photo always belongs to the product,
// because every one of them is kept in the same place.
function photo(o) {
  const body = o.has ? `<img src="${o.src}?v=${Date.now()}" alt="${o.caption}">`
    : o.fallback ? `<button class="none stand-in" data-set="${o.kind}" data-target="${o.target}">
         <img src="${o.fallback}" alt=""><span>${o.fallbackNote}<br>tap for a photo of this one</span></button>`
    : `<button class="none" data-set="${o.kind}" data-target="${o.target}">tap to add a photo</button>`;
  return `<figure>
    ${body}
    <figcaption>${o.caption}
      <span style="flex:1"></span>
      <button data-set="${o.kind}" data-target="${o.target}">${o.has ? 'replace' : 'add'}</button>
      ${o.has ? `<button class="rm" data-rm="${o.kind}" data-target="${o.target}">remove</button>` : ''}
    </figcaption>
    ${o.note ? `<figcaption class="muted" style="font-size:12px">${o.note}</figcaption>` : ''}
  </figure>`;
}

// What goes at the top of the page.
//
// A counted product shows two squares: the thing, and where it lives.
// A numbered product shows one wide picture of where they all live, because
// the picture of each individual one belongs to that one and is listed below.
// A single numbered one shows itself beside the place they share.
function photos(i) {
  const pid = i.productId || i.id;
  // A unit that lives somewhere of its own has its own picture of the place;
  // otherwise it shows the product's, which is the usual case.
  const ownPlace = i.unit && i.placeOwn;
  const place = extra => photo(Object.assign({
    kind: 'loc', target: ownPlace ? here(i) : pid, has: i.locationPhoto,
    src: ownPlace ? `/photos/${here(i)}-loc.jpg` : `/photos/${pid}-loc.jpg`,
    caption: 'where it lives',
  }, extra));

  if (i.tracked && !i.unit) {
    return `<div class="photos one">${place({ caption: 'where they all live' })}</div>`;
  }
  return `<div class="photos">
    ${photo({
      kind: 'item', target: here(i), has: i.photo,
      src: `/photos/${here(i)}-item.jpg`,
      caption: i.unit ? `this one, #${i.unit.n}` : 'the item',
      fallback: i.unit && !i.photo && i.productPhoto ? `/photos/${pid}-item.jpg` : null,
      fallbackNote: 'photo of the product',
    })}
    ${place({ note: i.unit ? (ownPlace ? 'this one lives apart from the rest' : 'shared with the rest of them') : '' })}
  </div>`;
}

// How many there are, or which one this is.
function headline(i) {
  const where = i.location ? `<b>${esc(i.location)}</b>` : '<span class="warn">no location set</span>';
  if (i.unit) return `<div class="big">this one · ${where}</div>`;
  if (i.tracked) return `<div class="big"><b>${i.units.length}</b> numbered individually · ${where}</div>`;
  return `<div class="big"><b>${i.quantity ?? 0}</b> in stock · ${where}</div>`;
}

// The numbered ones, each with the QR that is stuck on it. Holding one in
// your hand, you can match its code to a row here. The one you arrived on is
// outlined, so scanning a box tells you at a glance which of them it is.
function unitList(i, hereN) {
  const product = i.productId || i.id;
  return `<div class="card"><h2>${i.units.length} of them, each numbered</h2>
    <div class="units">${i.units.map(u => `
      <div class="unit${u.n === hereN ? ' here' : ''}">
        <a class="grab" href="/i/${product}-${u.n}">
          ${u.photo ? `<img class="pic" src="/photos/${product}-${u.n}-item.jpg" alt="" loading="lazy">` : '<span class="pic none"></span>'}
          <img class="qr" src="/api/items/${product}-${u.n}/qr.svg" alt="QR for #${u.n}" loading="lazy">
          <span class="n">#${u.n}</span>
          ${u.n === hereN ? '<span class="say">scanned</span>'
            : u.shelf ? `<span class="say">${esc(u.location || 'kept elsewhere')}</span>` : ''}
        </a>
        <a class="pr" href="/sticker?id=${product}-${u.n}">sticker</a>
        <button data-dropunit="${u.n}" title="retire #${u.n}">retire</button>
      </div>`).join('') || '<p class="muted" style="margin:0">None yet. Add the first one below.</p>'}
    </div>
    <div class="btnrow">
      <button class="btn" id="addunit">+ add one</button>
      <button class="btn" id="addunits">+ add several</button>
      <a class="btn" href="/labels?ids=${i.id}">Print all labels</a>
      <button class="btn" id="untrack">Switch to a plain quantity</button>
    </div></div>`;
}

function view(i) {
  const unitPart = i.unit ? ` <span class="badge">#${i.unit.n}</span>` : '';
  return `
    <h1>${esc(i.name)}${unitPart} ${i.kind === 'set' ? '<span class="muted">(set)</span>' : ''}</h1>
    <div class="id">${i.unitId || i.id}${i.unit ? ` · <a href="/i/${i.productId}?u=${i.unit.n}">one of ${i.units.length}</a>` : ''}</div>
    ${i.description ? `<p>${esc(i.description)}</p>` : ''}
    ${i.unit ? '' : `<details class="edit"><summary>edit name, description and tags</summary>
      <label>Name<input type="text" id="e-name" value="${esc(i.name)}"></label>
      <label>Description<input type="text" id="e-description" value="${esc(i.description || '')}"></label>
      <label>Tags<input type="text" id="e-tags" value="${esc((i.tags || []).join(', '))}" placeholder="comma separated, the words people would search for"></label>
      <div class="btnrow"><button class="btn primary" id="save">Save</button></div>
    </details>`}
    ${headline(i)}
    ${photos(i)}
    ${i.tags?.length ? `<div>${i.tags.map(t => `<span class="tag">${esc(t)}</span> `).join('')}</div>` : ''}
    ${i.tracked ? unitList(i, i.unit ? i.unit.n : scannedUnit()) : ''}
    ${!i.tracked && !i.unit ? `<div class="card"><h2>Counting</h2>
      <div class="countrow">
        <label for="count">Counted just now</label>
        <input type="number" id="count" min="0" inputmode="numeric" value="${i.quantity ?? 0}">
        <button class="btn primary" id="savecount">Save count</button>
      </div>
      <ul class="log" id="history"></ul>
      <p class="muted" style="margin:10px 0 0">One QR for the whole lot, and a quantity. Things lent out one at a time want a number and a label each instead, up to 50 of them.</p>
      <div class="btnrow"><button class="btn" id="track">Number each one</button></div></div>` : ''}
    <div class="card"><h2>Where it lives</h2>
      <select id="shelf"><option value="">${i.unit
        ? 'same as the product' + (i.productLocation ? ` · ${esc(i.productLocation)}` : '')
        : 'not filed yet'}</option></select>
      <p class="muted" style="margin:8px 0 0" id="placenote"></p>
      <div class="btnrow"><a class="btn" id="placelink" hidden>Open the shelf</a><a class="btn" href="/locations">Manage locations</a></div>
    </div>
    ${i.kind === 'set' ? `<div class="card"><h2>Contents</h2><ul>${i.contents.map(c => `<li><a href="/i/${c.itemId}">${esc(c.name)}</a> × ${c.qty}</li>`).join('') || '<li class="muted">empty</li>'}</ul>
      ${i.missing?.length ? `<p class="warn">Missing: ${i.missing.map(m => `${esc(m.itemId)} × ${m.qty}`).join(', ')}</p>` : ''}</div>` : ''}
    ${i.openLoans?.length ? `<div class="card"><h2>Out with</h2><ul>${i.openLoans.map(l => `<li>${esc(l.who)} × ${l.qty} since ${l.borrowedAt.slice(0, 10)}</li>`).join('')}</ul></div>` : ''}
    <div class="card"><h2>Label</h2><div class="qrbox">
      <img src="/api/items/${here(i)}/qr.svg" alt="QR code">
      <div><p class="muted" style="margin:0 0 8px">${i.unit ? 'Scanning this opens this one. Stick it on the object itself.'
        : i.tracked ? 'Scanning this opens the whole group. The label that goes on each one is above.'
        : 'Scanning this opens this page. Stick it on the box or the shelf.'}</p>
      <a class="btn" href="/labels?ids=${here(i)}">Print sheet</a>
      <a class="btn" href="/sticker?id=${here(i)}">Sticker printer</a></div>
    </div></div>
    <div class="btnrow">
      <button class="btn primary" id="add">+ add to my list</button>
      <button class="btn danger" id="del">${i.unit ? 'Retire this one' : 'Delete item'}</button>
    </div>
    <p class="err" id="err" hidden></p>
    <p class="muted">Updated ${i.updatedAt ? i.updatedAt.slice(0, 10) : '—'}</p>`;
}

// The thing this page is about: one unit, or the product.
const here = i => i.unitId || i.id;

// Which unit brought you here: the one in the URL of a unit page, or the ?u=
// carried over when you tapped through from one.
const scannedUnit = () => Number(new URLSearchParams(location.search).get('u')) || null;

function fail(msg) { const e = document.getElementById('err'); e.textContent = msg; e.hidden = false; e.className = 'err'; }
function flash(msg) { const e = document.getElementById('err'); e.textContent = msg; e.hidden = false; e.className = 'muted'; }

// What has happened to this item lately: counts, photos, filing.
async function showHistory() {
  const ul = document.getElementById('history');
  if (!ul) return;
  const events = await (await fetch(`/api/items/${item.id}/history?limit=6`)).json().catch(() => []);
  const said = { count: e => `counted <b>${e.from} → ${e.to}</b>`, photo: () => 'photo added', 'photo-removed': () => 'photo removed',
    filed: () => 'filed on a shelf', 'units-added': e => `added #${e.units.join(', #')}`, 'unit-removed': e => `retired #${e.unit}`,
    tracked: e => (e.tracked ? 'started numbering each one' : 'went back to a quantity') };
  ul.innerHTML = events.filter(e => said[e.type])
    .map(e => `<li>${e.at.slice(0, 10)} · ${said[e.type](e)}${e.who ? ' · ' + Nerva.esc(e.who) : ''}</li>`).join('');
}

// The place picker lists every location and shelf, so filing is one tap. On a
// numbered one, the empty choice means "wherever the product says", which is
// where they all start and where most of them stay.
async function fillPlaces(select) {
  const locations = await (await fetch('/api/locations')).json().catch(() => []);
  const note = document.getElementById('placenote');
  const link = document.getElementById('placelink');
  if (!locations.length) {
    note.innerHTML = 'No locations yet. <a href="/locations">Create the first cabinet</a>, then file this on a shelf.';
    select.hidden = true; link.hidden = true; return;
  }
  for (const l of locations) {
    const shelves = l.shelves.map(s => `<option value="${s.id}">${Nerva.esc(s.name)}</option>`).join('');
    select.insertAdjacentHTML('beforeend',
      `<optgroup label="${Nerva.esc(l.name)}"><option value="${l.id}">anywhere in ${Nerva.esc(l.name)}</option>${shelves}</optgroup>`);
  }
  select.value = (item.unit ? (item.placeOwn ? item.shelf : '') : item.shelf) || '';
  const sync = () => { link.hidden = !select.value; if (select.value) link.href = '/l/' + select.value; };
  sync();
  note.innerHTML = placeNote();
  select.onchange = async () => {
    try { await call('PUT', `/api/items/${here(item)}/shelf`, { shelf: select.value || null }); await load(); }
    catch (e) { fail('Not filed: ' + e.message); }
  };
}

function placeNote() {
  if (item.unit) return item.placeOwn
    ? 'This one is kept apart from the rest. Choosing “same as the product” puts it back with them.'
    : 'It is wherever the product says. Pick a shelf if this one is kept somewhere else.';
  if (item.tracked) return 'Where they all live. A numbered one can be filed somewhere else on its own page.';
  if (!item.shelf && item.location) return `Currently written as free text: “${Nerva.esc(item.location)}”. Pick a shelf to make it a real place.`;
  return '';
}

async function call(method, url, body) {
  const d = await Nerva.api(method, url, body);
  await Nerva.refreshCatalogue();
  return d;
}

function wire() {
  document.getElementById('add').onclick = () => {
    Nerva.addLine(here(item), item.unit ? `${item.name} #${item.unit.n}` : item.name);
    location.href = '/';
  };

  document.getElementById('del').onclick = async function () {
    if (item.unit) {
      if (!confirm(`Retire ${item.name} #${item.unit.n}? Its label stops working and the number is never reused.`)) return;
      this.disabled = true;
      try { await call('DELETE', `/api/items/${item.productId}/units/${item.unit.n}`); location.href = '/i/' + item.productId; }
      catch (e) { this.disabled = false; fail('Not retired: ' + e.message); }
      return;
    }
    if (!confirm(`Delete "${item.name}"? The photos go too. This cannot be undone.`)) return;
    this.disabled = true;
    try { await Nerva.deleteItem(item.id); location.href = '/items'; }
    catch (e) { this.disabled = false; fail('Not deleted: ' + e.message); }
  };

  const track = document.getElementById('track');
  if (track) track.onclick = async function () {
    if (!confirm(`Give each of the ${item.quantity} a number and its own QR label?`)) return;
    this.disabled = true;
    try { await call('PUT', `/api/items/${item.id}/tracked`, { tracked: true }); await load(); }
    catch (e) { this.disabled = false; fail('Not changed: ' + e.message); }
  };

  const untrack = document.getElementById('untrack');
  if (untrack) untrack.onclick = async function () {
    if (!confirm('Go back to a plain quantity? The numbers and their labels stop meaning anything.')) return;
    this.disabled = true;
    try { await call('PUT', `/api/items/${item.id}/tracked`, { tracked: false }); await load(); }
    catch (e) { this.disabled = false; fail('Not changed: ' + e.message); }
  };

  const save = document.getElementById('save');
  if (save) save.onclick = async function () {
    this.disabled = true;
    const body = {};
    for (const f of ['name', 'description', 'tags']) body[f] = document.getElementById('e-' + f).value;
    try { await call('PUT', `/api/items/${item.id}`, body); await load(); flash('saved'); }
    catch (e) { this.disabled = false; fail('Not saved: ' + e.message); }
  };

  const savecount = document.getElementById('savecount');
  if (savecount) {
    showHistory();
    savecount.onclick = async function () {
      this.disabled = true;
      try {
        const d = await call('POST', `/api/items/${item.id}/count`, { quantity: document.getElementById('count').value });
        await load();
        flash(d.delta === 0 ? 'counted, unchanged' : `counted: ${d.from} → ${d.to} (${d.delta > 0 ? '+' : ''}${d.delta})`);
      } catch (e) { this.disabled = false; fail('Not counted: ' + e.message); }
    };
  }

  const shelf = document.getElementById('shelf');
  if (shelf) fillPlaces(shelf);

  const addSeveral = document.getElementById('addunits');
  if (addSeveral) addSeveral.onclick = async function () {
    const count = Number(prompt('How many more?', '3'));
    if (!count || count < 1) return;
    this.disabled = true;
    try { const d = await call('POST', `/api/items/${item.productId || item.id}/units`, { count }); await load(); flash(`added ${d.added.join(', ')}`); }
    catch (e) { this.disabled = false; fail('Not added: ' + e.message); }
  };

  const addUnit = document.getElementById('addunit');
  if (addUnit) addUnit.onclick = async function () {
    this.disabled = true;
    try { const d = await call('POST', `/api/items/${item.productId || item.id}/units`, { count: 1 }); await load(); flash(`added ${d.added.join(', ')} – print its label`); }
    catch (e) { this.disabled = false; fail('Not added: ' + e.message); }
  };

  document.querySelectorAll('[data-dropunit]').forEach(b => b.onclick = async () => {
    const n = Number(b.dataset.dropunit);
    if (!confirm(`Retire #${n}? The number is never reused.`)) return;
    const product = item.productId || item.id;
    try {
      await call('DELETE', `/api/items/${product}/units/${n}`);
      // retiring the unit whose page this is leaves nothing to show
      if (item.unit && item.unit.n === n) location.href = '/i/' + product; else await load();
    } catch (e) { fail('Not retired: ' + e.message); }
  });

  document.querySelectorAll('[data-set]').forEach(b => b.onclick = async () => {
    const blob = await Nerva.photoFromCamera();   // pick, shrink, highlight
    if (!blob) return;
    b.disabled = true;
    try { await Nerva.uploadPhoto(b.dataset.target, b.dataset.set, blob); await load(); }
    catch (e) { b.disabled = false; fail('Photo not saved: ' + e.message); }
  });

  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try { await Nerva.removePhoto(b.dataset.target, b.dataset.rm); await load(); }
    catch (e) { b.disabled = false; fail('Photo not removed: ' + e.message); }
  });
}
</script>
</body>
</html>
